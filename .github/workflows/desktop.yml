name: FR offline installer
on:
  workflow_dispatch:
  push:
    tags: ['fr-desktop-v*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop-fr/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix desktop-fr
      - run: node desktop-fr/stage.mjs
      - run: npm ci
        working-directory: .desktop-build
      - name: Build genuine NSIS installer
        run: npm run package:win
        working-directory: .desktop-build
      - name: Silently install and verify installed executable
        shell: pwsh
        run: |
          $installer = Get-ChildItem '.desktop-build/installers/FR-eyewear-studio-*-win-x64.exe' | Select-Object -First 1
          if (!$installer) { throw 'NSIS installer missing' }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S /D=C:\fr-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "NSIS exit code $($process.ExitCode)" }
          $exe = 'C:\fr-test\FR eyewear studio.exe'
          if (!(Test-Path $exe)) { throw 'Installed executable missing' }
          $env:FR_INSTALLED_APP = '1'
          $env:FR_ELECTRON_EXECUTABLE = $exe
          $env:FR_SMOKE_OUTPUT = "$env:RUNNER_TEMP\fr-offline-smoke"
          node .desktop-build/desktop/smoke-offline.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed offline smoke failed' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($installer.Name)" } | Set-Content '.desktop-build/installers/SHA256SUMS.txt'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fr-offline-verification
          path: ${{ runner.temp }}/fr-offline-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: fr-windows-installer
          path: |
            .desktop-build/installers/FR-eyewear-studio-*-win-x64.exe
            .desktop-build/installers/SHA256SUMS.txt
      - name: Publish verified release
        if: startsWith(github.ref, 'refs/tags/fr-desktop-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag .desktop-build/installers/FR-eyewear-studio-*-win-x64.exe .desktop-build/installers/SHA256SUMS.txt --title "FR eyewear studio $($tag.Replace('fr-desktop-v','')) — Windows offline" --notes 'Instalador Windows x64 sin conexión. Incluye modelador, importación asistida local, proyectos, exportación GLB y dos hojas de fabricación. Instalación y funcionamiento verificados en CI. Instalador sin firma Authenticode.'
